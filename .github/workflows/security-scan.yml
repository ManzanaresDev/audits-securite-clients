name: Scan de sécurité du site

# Se déclenche à chaque modification poussée sur la branche principale,
# donc à chaque fois que Netlify redéploie le site.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permet aussi de le lancer manuellement depuis l'onglet "Actions"

permissions:
  contents: write   # nécessaire pour que le robot puisse commiter le rapport

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Attendre que Netlify ait fini de déployer
        run: sleep 60

      - name: Lancer le scan de sécurité
        env:
          SITE_URL: "https://jardin-des-sens-par-emilie.com"
        run: node scripts/scan.mjs

      - name: Commiter le rapport généré
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Rapport de sécurité automatique [skip ci]"
          git push
